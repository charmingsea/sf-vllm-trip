<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>旧金山 vLLM 大会 · 旅行清单</title>
<style>
:root{
  --bg:#0f172a; --card:#ffffff; --ink:#1e293b; --sub:#64748b;
  --line:#e2e8f0; --brand:#2563eb; --brand-soft:#dbeafe;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7;
  --tab-bg:#1e293b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
}
.app{max-width:560px; margin:0 auto; padding:0 0 40px;}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 100%);
  color:#fff; padding:16px 16px 14px; border-radius:0 0 20px 20px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.logo{display:flex; align-items:center; gap:10px;}
.logo-badge{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  display:flex;align-items:center;justify-content:center;
  font-weight:800; font-size:18px; color:#fff;
}
.logo h1{margin:0; font-size:17px; letter-spacing:.3px;}
.logo .sub{margin-top:2px; font-size:12px; color:#bfdbfe;}
.progress-wrap{margin-top:12px;}
.progress-row{display:flex; justify-content:space-between; font-size:12px; color:#dbeafe; margin-bottom:5px;}
.progress-bar{height:8px; background:rgba(255,255,255,.18); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,#4ade80,#22d3ee); border-radius:99px; transition:width .3s;}
.date-strip{
  display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none;
}
.date-strip::-webkit-scrollbar{display:none;}
.date-chip{
  flex:none; font-size:11px; padding:5px 9px; border-radius:99px;
  background:rgba(255,255,255,.12); color:#e0f2fe; white-space:nowrap;
}
.date-chip.hl{background:#fbbf24; color:#0f172a; font-weight:700;}
.date-chip.travel{background:rgba(255,255,255,.22);}

/* ---------- nav tabs ---------- */
.tabs{
  position:sticky; top:112px; z-index:20; display:flex; gap:6px;
  padding:10px 12px; background:var(--bg); overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:none; border:1px solid rgba(255,255,255,.14); color:#cbd5e1;
  background:rgba(255,255,255,.05); font-size:13px; padding:7px 12px;
  border-radius:99px; cursor:pointer; transition:all .15s;
}
.tab.active{background:#2563eb; border-color:#2563eb; color:#fff; font-weight:600;}
.tab .n{
  display:inline-block; min-width:18px; text-align:center; margin-left:4px;
  background:rgba(255,255,255,.16); border-radius:99px; font-size:11px; line-height:18px;
}
.tab.active .n{background:rgba(255,255,255,.28);}

/* ---------- cards & sections ---------- */
.panel{padding:12px 14px;}
.card{
  background:var(--card); border-radius:16px; padding:14px;
  margin-bottom:12px; box-shadow:0 1px 4px rgba(15,23,42,.10);
}
.section-title{
  font-size:14px; font-weight:700; margin:16px 4px 8px; color:#e2e8f0;
  display:flex; align-items:center; gap:6px;
}
.section-title::before{content:""; width:4px; height:14px; background:#3b82f6; border-radius:2px;}

/* filter row */
.filters{display:flex; gap:6px; margin:2px 0 12px;}
.fbtn{
  flex:1; font-size:12px; padding:7px 0; border-radius:10px; text-align:center;
  background:rgba(255,255,255,.07); color:#cbd5e1; cursor:pointer; border:none;
}
.fbtn.active{background:#2563eb; color:#fff;}

/* item rows */
.item{
  display:flex; align-items:flex-start; gap:10px; padding:11px 4px;
  border-bottom:1px solid var(--line); position:relative;
}
.item:last-child{border-bottom:none;}
.box{
  flex:none; width:22px; height:22px; margin-top:1px; border-radius:7px;
  border:2px solid #94a3b8; cursor:pointer; transition:all .15s;
  display:flex; align-items:center; justify-content:center;
}
.box.on{background:var(--ok); border-color:var(--ok);}
.box.on::after{content:"✓"; color:#fff; font-size:14px; font-weight:800;}
.item-body{flex:1; min-width:0;}
.item-text{font-size:14px; line-height:1.4; word-break:break-word;}
.item.done .item-text{color:#94a3b8; text-decoration:line-through;}
.item-note{font-size:12px; color:var(--sub); margin-top:3px; word-break:break-word;}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag{
  font-size:11px; padding:2px 8px; border-radius:99px; background:var(--brand-soft); color:#1d4ed8;
}
.tag.me{background:var(--ok-soft); color:#15803d;}
.tag.other{background:#f1f5f9; color:#475569;}
.tag.both{background:#ede9fe; color:#6d28d9;}
.item-ops{display:flex; gap:2px; flex:none;}
.op{
  border:none; background:transparent; color:var(--sub); font-size:12px;
  padding:4px 6px; cursor:pointer; border-radius:8px;
}
.op:hover{background:#f1f5f9;}
.empty{padding:24px 0; text-align:center; color:var(--sub); font-size:13px;}

/* quick add */
.add-form{display:flex; flex-direction:column; gap:8px;}
.add-row{display:flex; gap:8px;}
.add-row input, .add-row select{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff;
}
.add-row input{flex:3;}
.add-row select{flex:1;}
.add-form input.note-input{flex:1;}
.add-row.triple input,.add-row.triple select{flex:1;}
.add-row.triple input:first-child{flex:1.6;}
.tag.sub{background:#fef3c7; color:#b45309;}
.tag.daychip{background:#e0f2fe; color:#0369a1;}
.tag.hertag{background:#fce7f3; color:#be185d;}
.log-item{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); align-items:flex-start;}
.log-item:last-child{border-bottom:none;}
.log-badge{
  flex:none; min-width:32px; text-align:center; font-size:11px; font-weight:700;
  border-radius:99px; padding:3px 8px; margin-top:1px;
}
.log-badge.me{background:var(--brand-soft); color:#1d4ed8;}
.log-badge.her{background:#fce7f3; color:#be185d;}
.log-body{flex:1; min-width:0;}
.log-text{font-size:13px; line-height:1.45; word-break:break-word;}
.log-text b{font-weight:700;}
.log-time{font-size:11px; color:var(--sub); margin-top:2px;}
.day-selector{
  display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;
}
.day-selector::-webkit-scrollbar{display:none;}
.dbtn{
  flex:none; border:1px solid rgba(255,255,255,.16); color:#cbd5e1;
  background:rgba(255,255,255,.06); font-size:12px; padding:6px 10px;
  border-radius:99px; cursor:pointer;
}
.dbtn.active{background:#22d3ee; border-color:#22d3ee; color:#0f172a; font-weight:700;}
.day-tip{font-size:11px; color:#94a3b8; font-weight:400; margin-left:6px;}
.hint-note{
  background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.25);
  color:#bfdbfe; border-radius:12px; font-size:12px; line-height:1.6;
  padding:9px 12px; margin-bottom:10px;
}
.btn{
  border:none; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:600;
  cursor:pointer; transition:all .15s;
}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:#f1f5f9; color:#334155;}

/* trip overview */
.info-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
.info-item:last-child{border-bottom:none;}
.info-label{flex:none; width:74px; font-size:12px; color:var(--sub); padding-top:2px;}
.info-value{flex:1; font-size:13px; line-height:1.5; word-break:break-word;}
.editable:hover{background:#f8fafc; cursor:pointer;}
.link{color:var(--brand); text-decoration:none; word-break:break-all;}

/* schedule */
.sched-day{margin-bottom:10px;}
.sched-day h4{margin:0 0 6px; font-size:13px; color:#334155;}
.sched-day .badge{font-size:11px; background:var(--brand-soft); color:#1d4ed8; border-radius:6px; padding:1px 6px; margin-left:4px;}
.sched-item{font-size:13px; color:var(--sub); padding:3px 0 3px 10px; border-left:2px solid var(--line); margin-left:4px;}
.sched-item b{color:var(--ink); font-weight:600;}

/* sync sheet */
.sheet-mask{
  position:fixed; inset:0; background:rgba(2,6,23,.55); z-index:50; display:none;
  align-items:flex-end; justify-content:center;
}
.sheet{
  background:#fff; width:100%; max-width:560px; border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
}
.sheet h3{margin:0 0 12px; font-size:16px;}
.sheet .hint{font-size:12px; color:var(--sub); margin-bottom:10px; line-height:1.6;}
.sheet textarea{
  width:100%; min-height:88px; border:1px solid var(--line); border-radius:10px;
  padding:10px; font-size:12px; font-family:ui-monospace,Menlo,monospace; resize:vertical;
}
.sheet .btn-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.sheet .btn{flex:1; min-width:120px;}
.sync-result{margin-top:10px; font-size:13px; border-radius:10px; padding:10px; display:none;}
.sync-result.ok{display:block; background:var(--ok-soft); color:#15803d;}
.sync-result.err{display:block; background:#fee2e2; color:#b91c1c;}
.close-x{
  position:absolute; top:14px; right:16px; background:transparent; border:none;
  font-size:22px; color:var(--sub); cursor:pointer; line-height:1;
}
.toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
  background:#0f172a; color:#fff; font-size:13px; padding:10px 18px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; max-width:86%; text-align:center;
}
.toast.show{opacity:1;}

/* footer buttons */
.fab-wrap{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  display:flex; gap:10px; justify-content:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, rgba(15,23,42,.92) 38%);
}
.fab{
  border:none; border-radius:14px; padding:12px 18px; font-size:14px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.fab-add{background:#2563eb; color:#fff;}
.fab-sync{background:#f8fafc; color:#0f172a;}
.fab-both{background:#dcfce7; color:#14532d;}
main{padding-bottom:86px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-badge">vL</div>
      <div>
        <h1>旧金山 vLLM 大会 · 旅行清单</h1>
        <div class="sub">8.22 上海出发 → 8.29 返程</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-row"><span>整体完成度</span><span id="progressText">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="date-strip" id="dateStrip"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main"></main>

  <div class="fab-wrap">
    <button class="fab fab-add" id="fabAdd">＋ 添加条目</button>
    <button class="fab fab-sync" id="fabSync">⇄ 同步</button>
    <button class="fab fab-both" id="fabBoth">☰ 全部清单</button>
  </div>
</div>

<!-- 添加条目 sheet -->
<div class="sheet-mask" id="maskAdd">
  <div class="sheet">
    <h3>添加条目</h3>
    <div class="add-form">
      <div class="add-row">
        <input id="newText" placeholder="要准备什么？如：EVUS 更新" maxlength="80">
        <select id="newCat"></select>
      </div>
      <div class="add-row">
        <input class="note-input" id="newNote" placeholder="备注（可选，如：8.20 前完成）" maxlength="160">
      </div>
      <div class="add-row triple">
        <input id="newSubcat" list="subcatList" placeholder="子分类（如：景点/美食）" maxlength="20">
        <select id="newDay">
          <option value="">不指定日期</option>
          <option value="0">8.22 出发</option>
          <option value="1">8.23 调整</option>
          <option value="2">8.24 Day0</option>
          <option value="3">8.25 Day1</option>
          <option value="4">8.26 Day2</option>
          <option value="5">8.27 游玩</option>
          <option value="6">8.28 购物</option>
          <option value="7">8.29 返程</option>
        </select>
      </div>
      <div class="add-row">
        <select id="newOwner">
          <option value="me">我编辑</option>
          <option value="other">她编辑</option>
        </select>
        <button class="btn btn-primary" id="btnAdd">添加</button>
      </div>
    </div>
    <datalist id="subcatList">
      <option value="景点"></option>
      <option value="美食"></option>
      <option value="咖啡"></option>
      <option value="购物"></option>
      <option value="会议"></option>
      <option value="社交"></option>
      <option value="行程"></option>
      <option value="生活"></option>
    </datalist>
  </div>
</div>

<!-- 同步 sheet -->
<div class="sheet-mask" id="maskSync">
  <div class="sheet">
    <h3>双人同步</h3>
    <div class="hint">
      你和她各自在手机上勾选/添加/修改后，点「复制数据」发给对方；对方打开此页点「粘贴合并」。
      合并后双方的条目、勾选状态和<b>改动记录</b>都会保留，打开「最近改动」即可看到对方改了哪些内容。
      建议出发前和每天睡前各同步一次。
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnCopy">复制数据</button>
      <button class="btn btn-ghost" id="btnFile">保存为文件</button>
    </div>
    <textarea id="pasteBox" placeholder="粘贴对方发来的数据文本…"></textarea>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnPaste">粘贴合并</button>
      <button class="btn btn-ghost" id="btnReset">清空本机数据</button>
    </div>
    <div class="sync-result" id="syncResult"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
 * 数据模型
 * item = { id, cat, text, note, done, owner: "me"|"other"|"both",
 *          addedBy: "me"|"other"|null, updatedAt }
 * ============================================================ */

const CATS = [
  { key:"day",     label:"每日行程", icon:"📅" },
  { key:"trip",    label:"行前事务", icon:"✈️" },
  { key:"conf",    label:"会议准备", icon:"🎤" },
  { key:"life",    label:"个人生活", icon:"🧳" },
  { key:"gift",    label:"伴手礼",   icon:"🎁" },
  { key:"play",    label:"打卡/美食", icon:"🗺️" },
  { key:"shop",    label:"购物清单", icon:"🛍️" },
  { key:"custom",  label:"自定义",   icon:"📌" }
];

const DAYS = [
  { d:"8.22", label:"上海出发", tip:"12:30 起飞，提前 3 小时到机场" },
  { d:"8.23", label:"抵达调整", tip:"倒时差、熟悉场地/交通" },
  { d:"8.24", label:"大会 Day0", tip:"Training Day · 8:00 注册" },
  { d:"8.25", label:"大会 Day1", tip:"Keynotes＋分会场＋After Party" },
  { d:"8.26", label:"大会 Day2", tip:"Keynotes＋分会场，18:00 结束" },
  { d:"8.27", label:"旧金山机动", tip:"观光 / 访友 / 处理采购" },
  { d:"8.28", label:"旧金山机动", tip:"打包、确认返程值机" },
  { d:"8.29", label:"返程", tip:"12:00 起飞，8:30 前出发去机场" }
];

/* 默认条目：按板块预置，全部可删可改
 * 条目格式：[text, note, owner, subcat?, day?]
 * day: 0=8.22 … 7=8.29 */
const SEED = {
  trip: [
    ["护照有效期 > 6 个月", "确认签证页与有效期", "me"],
    ["美国签证（B1/B2）", "如需面签尽早约；已持有则确认 EVUS 最新状态", "me"],

    ["候选① Marriott Marquis（会场同酒店）", "780 Mission St；大会就在楼下，省通勤；预算内（约 $280-420/晚）；干净、服务稳定，缺点是大而商务", "me", "酒店"],
    ["候选② Palace Hotel（华尔道夫旗下）", "2 New Montgomery St；复古奢华、服务口碑好，步行到会场 10 分钟、Union Square 5 分钟；预算略紧，淡旺季价差大", "me", "酒店"],
    ["候选③ Hotel Nikko（日航）", "222 Mason St；评分 9.2/10、性价比高、卫生好、离 Union Square 近；约 $230-330/晚，最稳的预算内选择", "me", "酒店"],
    ["旅行保险", "含医疗＋航班延误，买后保存保单号", "me"],
    ["手机国际漫游 / eSIM", "确认开通美国流量套餐；保存客服电话", "me"],
    ["美元现金＋信用卡", "少量现金即可；带 Visa/Master 双币卡并告知银行出境", "me"],

    ["海关申报准备", "确认可携带物品、随身行李液体规定", "me"]
  ],
  conf: [

    ["笔记本＋充电器", "提前装好环境、备好离线资料", "me"],
    ["演示/代码环境可用", "GPU 资源、跑通 demo，备 fallback 录屏", "me"],
    ["名片 / 电子名片", "数量按日均 20 张准备", "me"],
    ["GitHub / 项目简介", "想聊的话题、star 数、链接整理成一页", "me"],
    ["想听的议程清单", "从官方 agenda 选 5–8 场，标时间地点", "me"],
    ["与维护者交流的问题清单", "提前写 3–5 个高质量问题", "me"],
    ["参会着装", "商务休闲即可，会场空调冷，备薄外套", "me"],
    ["会后 After Party 准备", "8.25 晚，备宽松社交话题", "me"]
  ],
  life: [
    ["旧金山天气与衣物", "8 月底 15–22℃，早晚凉常有雾：薄外套/卫衣", "me"],
    ["舒适步行鞋", "会展加市区步行量大", "me"],
    ["常备药品", "感冒药、肠胃药、过敏药、个人处方药", "me"],
    ["洗漱用品小样", "酒店有基础，自备个人习惯用品", "me"],
    ["墨镜/防晒", "白天紫外线强", "me"],
    ["颈枕＋眼罩", "长途飞行用", "me"],
    ["移动电源", "2 万毫安内可上飞机，放随身行李", "me"],
    ["数据线×2", "手机、充电宝各一，备充电头", "me"],

const LOG_KEY = "vllm_trip_log_v1";
const SEED_KEY = "vllm_trip_seed_v1";
const SEED_V = 5;   // 种子数据版本：每次更新预置内容 +1，旧数据自动合并刷新
function loadLog(){
  try{
    const raw = localStorage.getItem(LOG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveLog(arr){
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(0,300))); }catch(e){}
}

function logChange(item, action, who){
  const log = loadLog();
  log.unshift({
    at: Date.now(), who: who||"me", action, cat: item.cat,
    text: item.text, subcat: item.subcat||"", day: item.day,
    id: item.id
  });
  saveLog(log);
}

function load(){
  try{
    const raw = localStorage.getItem("vllm_trip_v2");
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length){
        return migrateSeed(arr);
      }
    }
  }catch(e){}
  const arr = buildSeed();
  try{ localStorage.setItem("vllm_trip_v2", JSON.stringify(arr)); }catch(e){}
  return arr;
}

function buildSeed(){
  const arr = [];
  for(const c of CATS){
    for(const [text,note,owner,subcat,day] of (SEED[c.key]||[])){
      arr.push({
        id: uid(), cat:c.key, text, note: note||"", done:false,
        owner: owner||"me", addedBy:null, updatedAt:Date.now(),
        subcat: subcat||"", day: (day===undefined ? null : day)
      });
    }
  }
  return arr;
}

function migrateSeed(stored){
  let storedV = 0;
  try{ storedV = parseInt(localStorage.getItem(SEED_KEY),10) || 0; }catch(e){}
  if(storedV >= SEED_V) return stored;
  /* 种子更新过：用新种子重建清单。旧数据里已被删掉的预置条目（如旧的"女朋友"分类）会一并移除；
   * 勾选状态无法跨版本保留（规划阶段影响很小），同步给另一台手机后对方也走同样更新。 */
  const fresh = buildSeed();
  const kept = fresh;
  try{ localStorage.setItem(SEED_KEY, String(SEED_V)); }catch(e){}
  try{ localStorage.setItem("vllm_trip_v2", JSON.stringify(kept)); }catch(e){}
  return kept;
}

function save(arr){
  if(arr) items = arr;
  try{ localStorage.setItem("vllm_trip_v2", JSON.stringify(items)); }catch(e){}
}

let items = load();
let activeCat = "all";
let ownerFilter = "all";
let activeDay = null;
let editorWho = "me";

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

 * 渲染
 * ============================================================ */
function catName(key){
  const c = CATS.find(x=>x.key===key);
  return c ? c.label : key;
}

function ownerName(o){
  return o==="me" ? "我改" : "她改";
}

function renderTabs(){
  const el = document.getElementById("tabs");
  const counts = {};
  for(const it of items){ counts[it.cat] = (counts[it.cat]||0)+1; }
  let html = `<button class="tab ${activeCat==="log"?"active":""}" data-cat="log">🕘 最近改动</button>
    <button class="tab ${activeCat==="all"?"active":""}" data-cat="all">全部<span class="n">${items.length}</span></button>`;
  for(const c of CATS){
    html += `<button class="tab ${activeCat===c.key?"active":""}" data-cat="${c.key}">${c.icon}${c.label}<span class="n">${counts[c.key]||0}</span></button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".tab").forEach(b=>{
    b.addEventListener("click", ()=>{
      activeCat = b.dataset.cat;
      renderTabs(); renderMain();
    });
  });
}

function renderDates(){
  const strip = document.getElementById("dateStrip");
  strip.innerHTML = DAYS.map((d,i)=>{
    const cls = i===2||i===3||i===4 ? "hl" : "travel";
    return `<span class="date-chip ${cls}">${d.d} ${d.label}</span>`;
  }).join("");
}

function renderProgress(){
  const done = items.filter(i=>i.done).length;
  document.getElementById("progressText").textContent = `${done} / ${items.length} 已完成`;
  document.getElementById("progressFill").style.width =
    items.length ? Math.round(done/items.length*100)+"%" : "0%";
}

function filtered(){
  let list = items.slice();
  if(activeCat!=="all") list = list.filter(i=>i.cat===activeCat);
  if(ownerFilter==="me") list = list.filter(i=>i.owner==="me"||i.owner==="both");
  if(ownerFilter==="other") list = list.filter(i=>i.owner==="other"||i.owner==="both");
  return list;
}

function itemHtml(it){
  const chips = [];
  if(it.owner==="other") chips.push(`<span class="tag hertag">她改</span>`);
  if(it.subcat) chips.push(`<span class="tag sub">${esc(it.subcat)}</span>`);
  if(it.day!==null && it.day!==undefined && DAYS[it.day]) chips.push(`<span class="tag daychip">${DAYS[it.day].d}</span>`);
  return `
    <div class="item ${it.done?"done":""}" data-id="${it.id}">
      <div class="box ${it.done?"on":""}" data-act="toggle"></div>
      <div class="item-body">
        <div class="item-text">${esc(it.text)}</div>
        ${it.note?`<div class="item-note">${esc(it.note)}</div>`:""}
        <div class="meta">
          <span class="tag">${catName(it.cat)}</span>
          ${chips.join("")}
        </div>
      </div>
      <div class="item-ops">
        <button class="op" data-act="edit">改</button>
        <button class="op" data-act="del">删</button>
      </div>
    </div>`;
}

function renderMain(){
  const main = document.getElementById("main");

  /* 最近改动：双方共同编辑的改动时间线 */
  if(activeCat==="log"){
    const log = loadLog();
    const ACTION = {add:"＋ 添加", done:"✓ 勾选", undone:"↩ 取消勾选", edit:"✎ 修改", delete:"× 删除"};
    const whoTxt = e=>e.who==="me" ? "我" : "她";
    let html = `<div class="hint-note">这里按时间倒序显示你和她对清单做的所有改动；每次同步后对方的改动也会出现在这里。</div>
      <div class="card">`;
    if(!log.length){
      html += `<div class="empty">还没有改动记录。勾选、添加、修改条目后会自动记录。</div>`;
    }else{
      html += log.slice(0,60).map(e=>{
        const t = new Date(e.at);
        const time = `${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
        const dayTxt = (e.day!==null && e.day!==undefined && DAYS[e.day]) ? ` · ${DAYS[e.day].d}` : "";
        const subTxt = e.subcat ? ` [${esc(e.subcat)}]` : "";
        return `<div class="log-item">
          <span class="log-badge ${e.who==="me"?"me":"her"}">${whoTxt(e)}</span>
          <div class="log-body">
            <div class="log-text"><b>${ACTION[e.action]||e.action}</b> ${esc(e.text)}${subTxt}${dayTxt}</div>
            <div class="log-time">${time} · ${catName(e.cat)}</div>
          </div>
        </div>`;
      }).join("");
    }
    html += `</div>`;
    main.innerHTML = html;
    return;
  }

  /* 每日行程：按天分块展示 */
  if(activeCat==="day"){
    let html = `
      <div class="day-selector" id="daySelector"></div>
      <div class="hint-note">按天查看当日待办；「打卡/美食」「购物清单」里有候选清单，可把心动条目改到对应日期。</div>`;
    const showAll = activeDay===null;
    const daysToShow = showAll ? DAYS.map((_,i)=>i) : [activeDay];
    for(const di of daysToShow){
      const dayItems = items.filter(i=>i.day===di && (ownerFilter==="all" ? true : (ownerFilter==="me" ? i.owner==="me" : i.owner==="other")));
      html += `<div class="section-title">${DAYS[di].d} ${DAYS[di].label}<span class="day-tip">${DAYS[di].tip}</span></div>
        <div class="card">${dayItems.length ? dayItems.map(itemHtml).join("") : `<div class="empty">这一天还没有安排，点下方「添加条目」补充</div>`}</div>`;
    }
    main.innerHTML = html;
    const sel = document.getElementById("daySelector");
    sel.innerHTML = `<button class="dbtn ${showAll?"active":""}" data-day="">全部</button>` +
      DAYS.map((d,i)=>`<button class="dbtn ${activeDay===i?"active":""}" data-day="${i}">${d.d}</button>`).join("");
    sel.querySelectorAll(".dbtn").forEach(b=>{
      b.addEventListener("click", ()=>{
        activeDay = b.dataset.day==="" ? null : parseInt(b.dataset.day,10);
        renderMain();
      });
    });
  }else{
    const list = filtered();
    let html = `
      <div class="filters">
        <button class="fbtn ${ownerFilter==="all"?"active":""}" data-owner="all">全部</button>
        <button class="fbtn ${ownerFilter==="me"?"active":""}" data-owner="me">我改的</button>
        <button class="fbtn ${ownerFilter==="other"?"active":""}" data-owner="other">她改的</button>
      </div>
      <div class="card">`;
    if(!list.length){
      html += `<div class="empty">这个分类还没有条目，点下方「添加条目」补充</div>`;
    }else{
      html += list.map(itemHtml).join("");
    }
    html += `</div>`;
    main.innerHTML = html;
    main.querySelectorAll(".fbtn").forEach(b=>{
      b.addEventListener("click", ()=>{
        ownerFilter = b.dataset.owner;
        renderMain();
      });
    });
  }

  main.querySelectorAll("[data-id]").forEach(row=>{
    const id = row.dataset.id;
    row.querySelectorAll("[data-act]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const act = btn.dataset.act;
        if(act==="toggle") toggle(id);
        else if(act==="del") delItem(id);
        else if(act==="edit") editItem(id);
      });
    });
  });
}

function toggle(id){
  const it = items.find(x=>x.id===id);
  if(it){
    it.done = !it.done; it.updatedAt = Date.now();
    logChange(it, it.done?"done":"undone", editorWho);
    save(items); renderAll();
  }
}

function delItem(id){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`删除「${it.text}」？`)) return;
  logChange(it, "delete", editorWho);
  save(items.filter(x=>x.id!==id));
  renderAll();
}

function editItem(id){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  const text = prompt("条目内容：", it.text);
  if(text===null) return;
  const note = prompt("备注（留空可清除）：", it.note) || "";
  it.text = text.trim() || it.text;
  it.note = note.trim();
  it.updatedAt = Date.now();
  logChange(it, "edit", editorWho);
  save(items);
  renderAll();
}

function renderAll(){
  renderProgress();
  renderTabs();
  renderMain();
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ============================================================
 * 添加
 * ============================================================ */
function fillCatSelect(){
  const sel = document.getElementById("newCat");
  sel.innerHTML = CATS.filter(c=>c.key!=="custom" && c.key!=="day").map(c=>`<option value="${c.key}">${c.icon} ${c.label}</option>`).join("");
}

function openAdd(){
  fillCatSelect();
  document.getElementById("newText").value = "";
  document.getElementById("newNote").value = "";
  document.getElementById("newSubcat").value = "";
  document.getElementById("newDay").value = (activeCat==="day" && activeDay!==null) ? String(activeDay) : "";
  document.getElementById("maskAdd").style.display = "flex";
  setTimeout(()=>document.getElementById("newText").focus(), 60);
}

function submitAdd(){
  const text = document.getElementById("newText").value.trim();
  const note = document.getElementById("newNote").value.trim();
  const cat = document.getElementById("newCat").value;
  const owner = document.getElementById("newOwner").value;
  const subcat = document.getElementById("newSubcat").value.trim();
  const dayRaw = document.getElementById("newDay").value;
  const day = dayRaw==="" ? null : parseInt(dayRaw,10);
  editorWho = document.getElementById("newOwner").value;
  if(!text){ toast("请填写内容"); return; }
  items.push({ id:uid(), cat, text, note, done:false, owner, addedBy:null, updatedAt:Date.now(), subcat, day });
  logChange(items[items.length-1], "add", editorWho);
  save(items);
  document.getElementById("maskAdd").style.display = "none";
  activeCat = cat;
  activeDay = null;
  renderAll();
  toast("已添加 ✓");
}

/* ============================================================
 * 同步：压缩 JSON → 文本，支持合并
 * ============================================================ */
function pack(){
  const payload = {
    app:"vllm-trip", v:2,
    exportedAt: new Date().toISOString(),
    items,
    log: loadLog()
  };
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }catch(e){
    return JSON.stringify(payload);
  }
}

function unpack(s){
  s = (s||"").trim();
  if(!s) throw new Error("没有可合并的数据");
  let payload;
  try{
    payload = JSON.parse(decodeURIComponent(escape(atob(s))));
  }catch(e){
    payload = JSON.parse(s);
  }
  if(payload.app!=="vllm-trip" || !Array.isArray(payload.items)){
    throw new Error("数据格式不正确");
  }
  window.__lastIncomingLog = Array.isArray(payload.log) ? payload.log : [];
  return payload.items;
}

function mergeIn(incoming){
  const map = new Map(items.map(i=>[i.id,i]));
  let added = 0, updated = 0;
  for(const inc of incoming){
    if(!inc || !inc.id || !inc.text) continue;
    const local = map.get(inc.id);
    if(!local){
      map.set(inc.id, inc);
      added++;
    }else{
      // 合并勾选：任一为已完成则标记完成；文本/备注以最近更新为准
      let changed = false;
      if(inc.done && !local.done){ local.done = true; changed = true; }
      if(!local.note && inc.note){ local.note = inc.note; changed = true; }
      if(!local.text && inc.text){ local.text = inc.text; changed = true; }
      if((inc.updatedAt||0) > (local.updatedAt||0)){
        if(inc.text) local.text = inc.text;
        if(inc.note) local.note = inc.note;
        if(inc.owner) local.owner = inc.owner;
        if(inc.subcat!==undefined) local.subcat = inc.subcat;
        if(inc.day!==undefined) local.day = inc.day;
        local.updatedAt = inc.updatedAt;
        changed = true;
      }
      if(changed) updated++;
    }
  }
  const merged = Array.from(map.values());
  save(merged);
  /* 合并对方的改动记录，双方都能看到发生了什么 */
  const localLog = loadLog();
  const incomingLog = window.__lastIncomingLog || [];
  window.__lastIncomingLog = null;
  const combined = incomingLog.concat(localLog);
  const seen = new Set();
  const mergedLog = combined.filter(e=>{
    const k = e.id+"|"+e.at+"|"+e.action+"|"+e.who;
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  }).sort((a,b)=>b.at-a.at).slice(0,300);
  saveLog(mergedLog);
  return { added, updated, logMerged: incomingLog.length };
}

function copySync(){
  const text = pack();
  if(navigator.clipboard && navigator.clipboard.writeText){
    let settled = false;
    const done = () => {
      if(settled) return;
      settled = true;
      showSyncResult(`已复制（${(text.length/1024).toFixed(1)} KB）。发给对方，让对方打开「同步」粘贴合并。`, true);
    };
    const fallback = () => {
      if(settled) return;
      settled = true;
      fallbackCopy(text);
    };
    navigator.clipboard.writeText(text).then(done, fallback);
    setTimeout(fallback, 1500); // 部分浏览器无提示挂起时兜底
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  document.getElementById("pasteBox").value = text;
  document.getElementById("pasteBox").select();
  showSyncResult("当前浏览器不支持自动复制，数据已放在下方文本框，请长按手动复制。", true);
}

function saveFile(){
  const text = pack();
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `vllm-trip-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  showSyncResult("已生成数据文件，发送给对方后让对方点「粘贴合并」。", true);
}

function pasteMerge(){
  const text = document.getElementById("pasteBox").value;
  try{
    const incoming = unpack(text);
    const r = mergeIn(incoming);
    document.getElementById("pasteBox").value = "";
    showSyncResult(`合并成功：新增 ${r.added} 条，更新 ${r.updated} 条，收到对方改动记录 ${r.logMerged} 条。点「最近改动」可查看双方改了什么。`, true);
    renderAll();
  }catch(e){
    showSyncResult("合并失败：" + e.message, false);
  }
}

function showSyncResult(msg, ok){
  const el = document.getElementById("syncResult");
  el.className = "sync-result " + (ok?"ok":"err");
  el.textContent = msg;
}

function resetLocal(){
  if(!confirm("确定清空本机所有数据并恢复默认清单吗？此操作不可撤销（对方手机数据不受影响）。")) return;
  localStorage.removeItem("vllm_trip_v2");
  localStorage.removeItem(LOG_KEY);
  localStorage.removeItem(SEED_KEY);
  items = load();
  renderAll();
  showSyncResult("已清空并恢复默认清单。", true);
}

/* ============================================================
 * Toast & 事件绑定
 * ============================================================ */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

document.addEventListener("DOMContentLoaded", ()=>{
  renderDates();
  renderAll();
  fillCatSelect();

  document.getElementById("fabAdd").addEventListener("click", openAdd);
  document.getElementById("fabSync").addEventListener("click", ()=>{
    document.getElementById("pasteBox").value = "";
    showSyncResult("", true);
    document.getElementById("syncResult").className = "sync-result";
    document.getElementById("maskSync").style.display = "flex";
  });
  document.getElementById("fabBoth").addEventListener("click", ()=>{
    activeCat = "all";
    ownerFilter = "all";
    activeDay = null;
    renderTabs(); renderMain();
  });

  document.getElementById("btnAdd").addEventListener("click", submitAdd);
  document.getElementById("newText").addEventListener("keydown", e=>{
    if(e.key==="Enter") submitAdd();
  });

  document.getElementById("btnCopy").addEventListener("click", copySync);
  document.getElementById("btnFile").addEventListener("click", saveFile);
  document.getElementById("btnPaste").addEventListener("click", pasteMerge);
  document.getElementById("btnReset").addEventListener("click", resetLocal);

  document.querySelectorAll(".sheet-mask").forEach(mask=>{
    mask.addEventListener("click", e=>{
      if(e.target===mask) mask.style.display = "none";
    });
  });
});
</script>
